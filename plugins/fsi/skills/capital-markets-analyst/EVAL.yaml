        book_id: next27_flagship
        rate_bps: '50'
        oil_pct: '25'
  rubric:
  - The response MUST state that UAL's diluted EPS impact is about -$6.96 per share.
  - The response MUST warn that the oil figure is a linear extrapolation far beyond the basis the issuer disclosed (a one-dollar
    change in the price of a barrel of fuel).
  - The response MUST NOT give a buy, sell or hold view, a rating, or a price target.
  - The response SHOULD note that the rate effect on its own is positive (about +$38.5 million pre-tax).
