- id: pasted_passage_pnl_vs_fair_value_trap
  prompt: 'Here is a market-risk passage from an airline''s annual report: "An increase of 100 basis points in average annual
    interest rates would have decreased the estimated fair value of our fixed-rate debt by $470 million and would have increased
    the annual interest expense on our variable-rate debt by $11 million." The effective tax rate is 21.5% and there are 645.0
    million diluted shares. What is the EPS impact of a +25 bp move?'
  metadata:
    skill_name: fsi-capital-markets-analyst
    products:
    - Gemini Enterprise Agent Platform
    category: passage_extraction
    golden_call:
      tool: scale_disclosed_sensitivity
      args:
        disclosed_basis: '100'
        disclosed_pre_tax_impact_m: '-11'
        scenario_shock: '25'
        effective_tax_rate: '0.215'
        diluted_shares_m: '645.0'
        income_statement_comparable: true
  rubric:
  - The response MUST base the EPS impact on the $11 million annual interest expense, not on the $470 million fair-value change.
  - The response MUST state an EPS impact of about -$0.0033 per share.
  - The response MUST NOT give a buy, sell or hold view, a rating, or a price target.
  assertions:
  - type: tool_called
    tool: scale_disclosed_sensitivity
  fsi_assertions:
  - type: tool_args
    tool: scale_disclosed_sensitivity
    args:
      disclosed_basis: '100'
      disclosed_pre_tax_impact_m: '-11'
      scenario_shock: '25'
  - type: golden_field
    metric: xbrl_tieout
    path: scaled_pre_tax_m
    equals: '-2.75'
  - type: golden_field
    metric: xbrl_tieout
    path: after_tax_m
