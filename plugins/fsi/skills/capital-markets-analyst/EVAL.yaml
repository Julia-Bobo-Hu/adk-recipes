    path: holdings[ticker=UAL].scaled_impact.total_pre_tax_m
    equals: '-2933.42'
  - type: golden_field
    metric: xbrl_tieout
    path: holdings[ticker=UAL].scaled_impact.after_tax_m
    equals: '-2285.13'
  - type: golden_field
    metric: xbrl_tieout
    path: holdings[ticker=UAL].scaled_impact.eps_delta
    equals: '-6.9563'
  - type: golden_field
    metric: extrapolation_flag
    path: holdings[ticker=UAL].extrapolation_warning
    equals: true
  - type: golden_citations
  - type: response_mentions
    any_of:
    - '6.9563'
    - '6.96'
  - type: response_mentions
    any_of:
    - extrapolat
    - 2x
    - 25.62x
    - twice
