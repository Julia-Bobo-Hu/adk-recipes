# Evaluation contract for fsi-capital-markets-analyst.
#
# Same case shape as the other adk-recipes plugins: `rubric` lines are graded by an LLM
# judge, `assertions` are deterministic checks. scripts/eval_runner.py runs them in two tiers:
#
#   offline (default)  golden_field / golden_citations only. The case's golden tool call
#                      (metadata.golden_call) is replayed against the deterministic core.
#                      No model runs, so this tier says nothing about agent behaviour.
#   live (--live)      the agent answers `prompt`; tool_called / tool_args / response_* and
#                      the rubric are graded as well. For `response_figures_reviewed` a second
#                      model reads the prompt, the tool calls, the full tool outputs of that
#                      run and the answer, and reports every number it cannot support
#                      (scripts/answer_review.py); it feeds the gate figure_review_pct.
#
# Release gates and their defaults are defined in scripts/eval_runner.py (GATE_SPECS) and
# can be overridden per institution in design-spec.md (`eval_gates`).
#
# The bundled sample book holds passages and XBRL facts from 20 Form 10-K filings retrieved
# from SEC EDGAR (see its metadata and scripts/build_sample_book.py), and
# reported_financials.json holds the same issuers' reported annual figures. Expected values
# below are what the deterministic core computes from that data. The cases measure how the
# skill handles the bundled data; they do not test extraction from filings outside the book.
# A run switches SEC EDGAR lookups off, so a company outside the bundle is "not available"
# in every case here, and the live lookup itself is not evaluated.
cases:
- id: rate_shock_within_disclosed_basis
  prompt: For the Next '27 sample book, apply a +25 bp parallel rate shock with oil unchanged. What is the diluted EPS impact
    for Delta Air Lines (DAL), and which disclosure does it come from?
  metadata:
    skill_name: fsi-capital-markets-analyst
    products:
    - Gemini Enterprise Agent Platform
    - BigQuery
    category: xbrl_eps_tieout
    golden_call:
      tool: run_portfolio_shock_analysis
      args:
        book_id: next27_flagship
        rate_bps: '25'
        oil_pct: '0'
  rubric:
  - The response MUST state that DAL's diluted EPS impact is about -$0.0034 per share (a small decrease).
  - The response MUST attribute the figure to the Item 7A interest-rate disclosure ($11 million of annual interest expense
    per 100 basis points).
  - The response MUST NOT give a buy, sell or hold view, a rating, or a price target.
  - The response SHOULD cite the filing document id DAL-10K-FY2025.
  assertions:
  - type: tool_called
    tool: run_portfolio_shock_analysis
  fsi_assertions:
  - type: tool_args
    tool: run_portfolio_shock_analysis
    args:
      book_id: next27_flagship
      rate_bps: '25'
      oil_pct: '0'
  - type: golden_field
    metric: xbrl_tieout
    path: holdings[ticker=DAL].scaled_impact.total_pre_tax_m
    equals: '-2.75'
  - type: golden_field
    metric: xbrl_tieout
    path: holdings[ticker=DAL].scaled_impact.after_tax_m
    equals: '-2.22'
  - type: golden_field
    metric: xbrl_tieout
    path: holdings[ticker=DAL].scaled_impact.eps_delta
    equals: '-0.0034'
  - type: golden_field
    metric: extrapolation_false_alarm
    path: holdings[ticker=DAL].extrapolation_warning
    equals: false
  - type: golden_citations
  - type: response_mentions
    any_of:
    - '0.0034'
  - type: response_mentions
    any_of:
    - item 7a
  - type: response_quotes_verbatim
    min_quotes: 1
  - type: response_figures_reviewed
